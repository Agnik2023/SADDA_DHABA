name: Supabase keep-alive

# Supabase Free pauses a project after 7 days without activity. A paused
# project cannot take orders, so this workflow makes one small REST request
# every day.
#
# Required repository secrets:
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  The anon / publishable key

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

      - name: Ping database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"
          echo "Supabase REST responded with HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" = "200"
